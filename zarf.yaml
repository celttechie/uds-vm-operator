# Defense Unicorns UDS Virtual Machine Operator & Air-Gap Golden Image Package
kind: ZarfPackageConfig
metadata:
  name: uds-vm-operator
  description: "Defense Unicorns UDS Virtual Machine Operator & Air-Gap Golden Image Package"
  version: "0.5.1"
  architecture: "amd64"

components:
  - name: crds
    required: true
    description: "Install UDSVirtualMachine Custom Resource Definitions"
    manifests:
      - name: crds
        files:
          - manifests/crd/udsvirtualmachines.uds.dev.yaml
          - manifests/crd/udsvirtualmachinepools.uds.dev.yaml

  - name: operator
    required: true
    description: "Deploy UDS Virtual Machine Operator"
    manifests:
      - name: operator
        namespace: uds-system
        files:
          - manifests/operator/deployment.yaml
    images:
      - ghcr.io/celttechie/uds-vm-operator:v0.5.1

  - name: golden-images
    required: false
    description: "Air-gapped pre-baked Golden OS Images with cryptographic SHA-256 validation"
    files:
      - source: images/tactical-linux-golden.raw
        target: /var/uds/images/tactical-linux-golden.raw
        shasum: e5b844cc57f57094ea4585e235f36c78c1cd222262bb89d53c94dcb4d6b3e55d

  - name: golden-image-datasource
    required: false
    description: "Provision central CDI DataVolume & DataSource in uds-golden-images for fast cloning"
    manifests:
      - name: golden-image-datasource
        noWait: true
        files:
          - manifests/examples/golden-image-datasource.yaml

  - name: sample-vm
    default: true
    description: "Sample tactical sensor VM deployment"
    manifests:
      - name: sample-vm
        namespace: default
        files:
          - manifests/examples/tactical-sensor-vm.yaml
    actions:
      onDeploy:
        after:
          - cmd: "kubectl wait --for=condition=Ready udsvm/tactical-sensor-vm -n default --timeout=60s || true"
            description: "Wait for UDSVirtualMachine readiness"
          - cmd: "kubectl get udsvirtualmachines -A || true"
            description: "Display UDSVirtualMachine fleet status"

  - name: fast-clone-vm
    required: false
    description: "Sample fast-cloned UDSVirtualMachine with persistent retained dataDisk"
    manifests:
      - name: fast-clone-vm
        namespace: default
        files:
          - manifests/examples/fast-clone-persistent-vm.yaml
