name: CI & NIST Security Controls

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  go-security-and-test:
    name: Go Test & Security Analysis (NIST SA-11, RA-5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Module Dependencies (NIST CM-6)
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Run Go Vet & Static Analysis (NIST SA-11)
        run: go vet ./...

      - name: Run Go Unit Tests with Race Detector (NIST SA-11)
        run: go test -v -race -coverprofile=coverage.out ./pkg/controller/...

      - name: Build Operator Binary (NIST SA-11)
        run: go build -o bin/uds-vm-operator ./cmd/uds-vm-operator

      - name: Install and Run govulncheck (NIST SI-2 / RA-5)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  python-prototype-test:
    name: Python Prototype Test Parity (NIST SA-11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (qemu-utils)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r prototype-kopf/requirements.txt
          pip install pytest

      - name: Run Prototype pytest Suite
        run: pytest -v prototype-kopf/test_operator_kopf.py

  manifest-validation:
    name: Manifest Linting & CRD Validation (NIST CM-6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate YAML Formatting
        run: |
          python3 -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('manifests/**/*.yaml', recursive=True)]"
