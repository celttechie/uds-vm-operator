name: CI & NIST Security Controls

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  go-security-and-test:
    name: Go Test & Security Analysis (NIST SA-11, RA-5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Module Dependencies (NIST CM-6)
        run: |
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Run Go Vet & Static Analysis (NIST SA-11)
        run: go vet ./...

      - name: Run Go Unit Tests with Race Detector (NIST SA-11)
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build Operator & CLI Binaries (NIST SA-11)
        run: make build

      - name: Run govulncheck Security Analysis (NIST SI-2 / RA-5)
        continue-on-error: true
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  oscal-compliance-validation:
    name: Lula OSCAL Continuous ATO Validation (NIST SC-7, AC-3, SI-7, IA-5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Defense Unicorns Lula
        run: |
          go install github.com/defenseunicorns/lula@v0.8.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          lula version

      - name: Validate OSCAL Component Definition Syntax
        run: |
          python3 -c "import yaml; yaml.safe_load(open('compliance/oscal-component.yaml'))"

  manifest-validation:
    name: Manifest Linting & CRD Validation (NIST CM-6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate YAML Formatting
        run: |
          python3 -c "import yaml, glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('manifests/**/*.yaml', recursive=True)]"
          python3 -c "import yaml; list(yaml.safe_load_all(open('zarf.yaml')))"
