apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: udsvirtualmachines.uds.dev
spec:
  group: uds.dev
  names:
    kind: UDSVirtualMachine
    listKind: UDSVirtualMachineList
    plural: udsvirtualmachines
    singular: udsvirtualmachine
    shortNames:
      - udsvm
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Source
          type: string
          jsonPath: .spec.disk.sourceType
        - name: PVC-Size
          type: string
          jsonPath: .status.calculatedPvcSize
        - name: Checksum-Verified
          type: boolean
          jsonPath: .status.compliance.checksumVerified
        - name: Zero-Trust
          type: boolean
          jsonPath: .status.compliance.zeroTrustIsolated
        - name: Reconciler
          type: string
          jsonPath: .status.reconciledBy
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: UDSVirtualMachine declaratively provisions an air-gap hardened KubeVirt VirtualMachine, CDI DataVolume with cryptographic checksum verification, and Zero-Trust NetworkPolicy.
          properties:
            spec:
              type: object
              required:
                - disk
              properties:
                cpus:
                  type: integer
                  default: 2
                  minimum: 1
                memory:
                  type: string
                  default: "2Gi"
                runStrategy:
                  type: string
                  default: "Halted"
                disk:
                  type: object
                  required:
                    - sourceType
                    - checksum
                    - virtualSizeBytes
                  properties:
                    sourceType:
                      type: string
                      enum: ["upload", "http"]
                    httpUrl:
                      type: string
                    format:
                      type: string
                      enum: ["raw", "qcow2"]
                      default: "raw"
                    virtualSizeBytes:
                      type: integer
                      minimum: 1048576
                    checksum:
                      type: string
                      pattern: "^(md5|sha1|sha256|sha512):[a-fA-F0-9]+$"
                    storageClassName:
                      type: string
                securityProfile:
                  type: object
                  properties:
                    zeroTrustNetwork:
                      type: boolean
                      default: true
                    disallowSSHPassword:
                      type: boolean
                      default: true
                    fipsMode:
                      type: boolean
                      default: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                calculatedPvcSize:
                  type: string
                dataVolumeName:
                  type: string
                dataVolumePhase:
                  type: string
                reconciledBy:
                  type: string
                compliance:
                  type: object
                  properties:
                    checksumVerified:
                      type: boolean
                    zeroTrustIsolated:
                      type: boolean
                    cloudInitHardened:
                      type: boolean
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
