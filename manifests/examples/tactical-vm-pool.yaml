apiVersion: uds.dev/v1alpha1
kind: UDSVirtualMachinePool
metadata:
  name: tactical-vm-pool
  namespace: default
  labels:
    app.kubernetes.io/name: tactical-vm-pool
    app.kubernetes.io/managed-by: uds-vm-operator
    uds.dev/security-tier: mission-critical
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tactical-workload
    spec:
      osType: linux
      cpus: 2
      memory: 1Gi
      runStrategy: Always
      disk:
        sourceType: dataSource
        dataSourceName: tactical-linux-golden
        dataSourceNamespace: uds-golden-images
        format: raw
        virtualSizeBytes: 10485760
        checksum: sha256:e5b844cc57f57094ea4585e235f36c78c1cd222262bb89d53c94dcb4d6b3e55d
      securityProfile:
        zeroTrustNetwork: true
        disallowSSHPassword: true
        fipsMode: true
